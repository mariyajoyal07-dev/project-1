<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOSH-Style Courses Module — All-in-One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   EOSH-STYLE COURSES MODULE — visual system
   Palette (as specified): Dark Blue #0A2540 · Light Blue #4DA8DA · Blue #1E88E5 · White #FFFFFF
   Signature idea: courses presented as "certification plates" — a nod to
   compliance placards/data plates, with a monospace course-code chip and a
   corner level-tab, rather than generic flat cards.
   ========================================================================== */

:root{
  --ec-navy: #0A2540;
  --ec-navy-2: #0E2E4D;
  --ec-blue: #1E88E5;
  --ec-blue-light: #4DA8DA;
  --ec-white: #FFFFFF;
  --ec-bg: #F3F8FC;
  --ec-ink: #12202E;
  --ec-ink-soft: #4C6072;
  --ec-line: rgba(10,37,64,0.10);
  --ec-glass: rgba(255,255,255,0.62);
  --ec-glass-navy: rgba(10,37,64,0.55);
  --ec-shadow: 0 20px 45px -20px rgba(10,37,64,0.35);
  --ec-shadow-sm: 0 8px 24px -12px rgba(10,37,64,0.28);
  --ec-radius: 18px;
  --ec-radius-sm: 12px;
  --ec-font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
  --ec-font-body: 'Inter', 'Segoe UI', sans-serif;
  --ec-font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}

.ec-scope{
  font-family: var(--ec-font-body);
  color: var(--ec-ink);
  background: var(--ec-bg);
  -webkit-font-smoothing: antialiased;
}
.ec-scope *{ box-sizing: border-box; }
.ec-scope h1,.ec-scope h2,.ec-scope h3,.ec-scope h4{
  font-family: var(--ec-font-display);
  letter-spacing: -0.01em;
  margin: 0 0 .5em;
  color: var(--ec-navy);
}
.ec-scope a{ color: inherit; text-decoration: none; }
.ec-scope button{ font-family: inherit; cursor: pointer; }
.ec-container{ max-width: 1180px; margin: 0 auto; padding: 0 24px; }
.ec-visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }


.ec-related-strip {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  max-width: 100%;
  padding-bottom: 10px;
}

.ec-related-strip .ec-card {
  flex: 0 0 auto;
  min-width: 250px; /* adjust if needed */
}

/* Optional: prevent page from going wider than screen */
body {
  overflow-x: hidden;
}
/* ---------- Header addition ---------- */
.ec-header-add{
  display:flex; align-items:center; gap:10px; position:relative;
}
.ec-nav-item{
  position:relative;
}
.ec-nav-trigger{
  display:flex; align-items:center; gap:6px;
  background:none; border:none; color:var(--ec-white);
  font-family: var(--ec-font-display); font-size:15px; font-weight:600;
  padding:10px 14px; border-radius:10px; transition:.2s background;
}
.ec-nav-trigger:hover, .ec-nav-trigger.is-open{ background:rgba(255,255,255,0.12); }
.ec-nav-trigger svg{ width:12px; height:12px; transition:.25s transform; }
.ec-nav-trigger.is-open svg{ transform:rotate(180deg); }


.ec-header {
  width: 100%;
  background: #0d2b45;
}

.ec-header .ec-container {
  max-width: 1180px;
  margin: 0 auto;
}
/* ---------- Mega menu ---------- */
.ec-megamenu{
  position:absolute; top:calc(100% + 14px); left:50%; transform:translate(-50%,8px);
  width:min(920px, 92vw);
  background: var(--ec-glass);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,0.5);
  border-radius: 22px;
  box-shadow: var(--ec-shadow);
  padding:26px;
  opacity:0; visibility:hidden; pointer-events:none;
  transition: opacity .22s ease, transform .22s ease, visibility .22s;
  z-index:80;
}
.ec-megamenu.is-open{ opacity:1; visibility:visible; pointer-events:auto; transform:translate(-50%,0); }
.ec-mm-grid{
  display:grid; grid-template-columns: repeat(3,1fr); gap:22px 26px;
}
.ec-mm-cluster h4{
  font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  color: var(--ec-blue); margin-bottom:10px; font-weight:700;
}
.ec-mm-cluster ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.ec-mm-link{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:10px;
  font-size:14px; color:var(--ec-ink); transition:.15s background,.15s transform;
}
.ec-mm-link:hover{ background:rgba(30,136,229,0.10); transform:translateX(2px); }
.ec-mm-link .ic{ font-size:15px; }
.ec-mm-foot{
  margin-top:20px; padding-top:18px; border-top:1px solid var(--ec-line);
  display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
}
.ec-mm-cta{
  background: var(--ec-navy); color:var(--ec-white); padding:10px 18px; border-radius:12px;
  font-weight:600; font-size:14px; transition:.2s background;
}
.ec-mm-cta:hover{ background: var(--ec-blue); }
.ec-mm-stat{ font-family:var(--ec-font-mono); font-size:12.5px; color:var(--ec-ink-soft); }

/* ---------- Search ---------- */
.ec-search{ position:relative; width:280px; }
.ec-search-input-wrap{
  display:flex; align-items:center; gap:8px;
  background: rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.25);
  border-radius:12px; padding:9px 12px; transition:.2s;
}
.ec-search-input-wrap:focus-within{
  background: var(--ec-white); border-color: var(--ec-white);
  box-shadow: 0 0 0 3px rgba(77,168,218,0.45);
}
.ec-search-input-wrap svg{ width:15px; height:15px; flex-shrink:0; color:rgba(255,255,255,0.85); }
.ec-search-input-wrap:focus-within svg{ color: var(--ec-navy); }
.ec-search-input{
  background:none; border:none; outline:none; color:var(--ec-white); font-size:14px; width:100%;
}
.ec-search-input-wrap:focus-within .ec-search-input{ color:var(--ec-navy); }
.ec-search-input::placeholder{ color:rgba(255,255,255,0.7); }
.ec-search-input-wrap:focus-within .ec-search-input::placeholder{ color:var(--ec-ink-soft); }

.ec-search-panel{
  position:absolute; top:calc(100% + 10px); left:0; width:380px; max-width:88vw;
  background:var(--ec-white); border-radius:16px; box-shadow:var(--ec-shadow);
  border:1px solid var(--ec-line); padding:10px; z-index:90;
  opacity:0; visibility:hidden; transform:translateY(6px); transition:.18s;
  max-height:min(70vh, 520px); overflow-y:auto;
}
.ec-search-panel.is-open{ opacity:1; visibility:visible; transform:translateY(0); }
.ec-search-section-label{
  font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ec-ink-soft);
  padding:10px 12px 4px; font-weight:700;
}
.ec-search-chips{ display:flex; flex-wrap:wrap; gap:6px; padding:6px 10px 10px; }
.ec-chip{
  font-size:12.5px; padding:6px 11px; border-radius:999px; background:var(--ec-bg);
  border:1px solid var(--ec-line); color:var(--ec-navy); font-weight:600; transition:.15s;
}
.ec-chip:hover, .ec-chip.is-active{ background:var(--ec-blue); color:var(--ec-white); border-color:var(--ec-blue); }
.ec-result{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px; cursor:pointer;
}
.ec-result:hover, .ec-result.is-active{ background: rgba(30,136,229,0.09); }
.ec-result .ic{
  width:34px; height:34px; border-radius:10px; background:var(--ec-bg); display:flex; align-items:center;
  justify-content:center; font-size:16px; flex-shrink:0;
}
.ec-result .rt{ font-size:14px; font-weight:600; color:var(--ec-ink); }
.ec-result .rs{ font-size:12px; color:var(--ec-ink-soft); }
.ec-result mark{ background: rgba(77,168,218,0.35); color:inherit; border-radius:3px; padding:0 1px; }
.ec-search-empty{ padding:26px 16px; text-align:center; color:var(--ec-ink-soft); font-size:13.5px; }
.ec-search-empty strong{ display:block; color:var(--ec-navy); font-size:14.5px; margin-bottom:4px; }

/* ---------- Category pill filter row ---------- */
.ec-filter-row{ display:flex; flex-wrap:wrap; gap:8px; }

/* ---------- Course / category cards (the "certification plate") ---------- */
.ec-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:22px; }
.ec-card{
  position:relative; background:var(--ec-white); border-radius:var(--ec-radius);
  border:1px solid var(--ec-line); padding:22px; box-shadow:var(--ec-shadow-sm);
  transition:.25s transform,.25s box-shadow; overflow:hidden;
}
.ec-card::before{
  content:""; position:absolute; inset:0 0 auto 0; height:4px;
  background:linear-gradient(90deg,var(--ec-blue),var(--ec-blue-light));
}
.ec-card:hover{ transform:translateY(-5px); box-shadow:var(--ec-shadow); }
.ec-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px; }
.ec-card-icon{
  width:44px; height:44px; border-radius:12px; background:var(--ec-bg); display:flex; align-items:center;
  justify-content:center; font-size:20px;
}
.ec-tab{
  font-family:var(--ec-font-mono); font-size:11px; font-weight:600; color:var(--ec-blue);
  background: rgba(30,136,229,0.10); border-radius:999px; padding:4px 10px; white-space:nowrap;
}
.ec-card h3{ font-size:17px; margin-bottom:6px; }
.ec-card p{ font-size:13.5px; color:var(--ec-ink-soft); line-height:1.5; margin:0 0 14px; }
.ec-card-meta{ display:flex; gap:14px; font-size:12px; color:var(--ec-ink-soft); font-family:var(--ec-font-mono); margin-bottom:14px; }
.ec-card-foot{ display:flex; justify-content:space-between; align-items:center; }
.ec-code{ font-family:var(--ec-font-mono); font-size:11px; color:var(--ec-ink-soft); letter-spacing:.04em; }
.ec-link-arrow{ font-weight:700; font-size:13px; color:var(--ec-blue); display:flex; align-items:center; gap:4px; }
.ec-link-arrow:hover{ text-decoration:underline; }

.ec-pending-card{
  border:1.5px dashed rgba(10,37,64,0.22); background:rgba(255,255,255,0.5);
}
.ec-pending-card p.ec-pending-note{ font-size:12.5px; color:var(--ec-blue); font-weight:600; }

/* ---------- Section shell ---------- */
.ec-section{ padding:64px 0; }
.ec-eyebrow{
  font-family:var(--ec-font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ec-blue); font-weight:700; margin-bottom:10px; display:block;
}
.ec-section-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:32px; flex-wrap:wrap; }
.ec-section-head h2{ font-size:30px; }
.ec-section-head p{ color:var(--ec-ink-soft); max-width:520px; margin:0; }

/* ---------- Hero (course/category pages) ---------- */
.ec-hero{
  background: radial-gradient(1100px 460px at 15% -10%, rgba(77,168,218,0.35), transparent),
              linear-gradient(160deg,var(--ec-navy),var(--ec-navy-2) 70%);
  color:var(--ec-white); padding:74px 0 90px; position:relative; overflow:hidden;
}
.ec-hero::after{
  content:""; position:absolute; right:-8%; top:-20%; width:520px; height:520px; border-radius:50%;
  background: radial-gradient(circle at 30% 30%, rgba(77,168,218,0.35), transparent 65%);
}
.ec-breadcrumb{ font-size:13px; color:rgba(255,255,255,0.75); margin-bottom:22px; display:flex; gap:8px; flex-wrap:wrap; }
.ec-breadcrumb a:hover{ text-decoration:underline; }
.ec-hero-badges{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.ec-badge{
  font-family:var(--ec-font-mono); font-size:12px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); padding:6px 12px; border-radius:999px;
}
.ec-hero h1{ color:var(--ec-white); font-size:clamp(30px,4vw,46px); max-width:760px; }
.ec-hero .ec-lede{ color:rgba(255,255,255,0.82); max-width:640px; font-size:16px; line-height:1.6; }
.ec-hero-actions{ display:flex; gap:14px; margin-top:28px; flex-wrap:wrap; }
.ec-btn{
  display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:12px;
  font-weight:700; font-size:14.5px; border:1px solid transparent; transition:.2s;
}
.ec-btn-primary{ background:var(--ec-blue); color:var(--ec-white); }
.ec-btn-primary:hover{ background:#166fc0; }
.ec-btn-ghost{ background:rgba(255,255,255,0.1); color:var(--ec-white); border-color:rgba(255,255,255,0.3); }
.ec-btn-ghost:hover{ background:rgba(255,255,255,0.2); }
.ec-btn-outline-dark{ background:transparent; color:var(--ec-navy); border-color:var(--ec-navy); }
.ec-btn-outline-dark:hover{ background:var(--ec-navy); color:var(--ec-white); }

/* ---------- Course detail layout ---------- */
.ec-detail-layout{ display:grid; grid-template-columns: 1fr 340px; gap:40px; align-items:start; }
.ec-panel{
  background:var(--ec-white); border:1px solid var(--ec-line); border-radius:var(--ec-radius);
  padding:26px; box-shadow:var(--ec-shadow-sm); margin-bottom:24px;
}
.ec-panel h2{ font-size:19px; }
.ec-outcome-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.ec-outcome-list li{ display:flex; gap:10px; font-size:14.5px; line-height:1.5; }
.ec-outcome-list li::before{ content:"✓"; color:var(--ec-blue); font-weight:800; flex-shrink:0; }
.ec-module-list{ list-style:none; margin:0; padding:0; counter-reset:mod; display:flex; flex-direction:column; gap:8px; }
.ec-module-list li{
  counter-increment:mod; display:flex; gap:12px; align-items:baseline; font-size:14.5px;
  padding:12px 14px; background:var(--ec-bg); border-radius:10px;
}
.ec-module-list li::before{
  content:counter(mod,decimal-leading-zero); font-family:var(--ec-font-mono); color:var(--ec-blue); font-weight:700; font-size:12px;
}
.ec-info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.ec-info-item{ background:var(--ec-bg); border-radius:12px; padding:14px; }
.ec-info-item .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ec-ink-soft); font-weight:700; }
.ec-info-item .val{ font-family:var(--ec-font-mono); font-size:14.5px; color:var(--ec-navy); margin-top:3px; }

.ec-faq-item{ border-bottom:1px solid var(--ec-line); }
.ec-faq-q{
  width:100%; text-align:left; background:none; border:none; padding:15px 4px; display:flex;
  justify-content:space-between; align-items:center; font-weight:600; font-size:14.5px; color:var(--ec-navy);
}
.ec-faq-q .plus{ transition:.2s transform; color:var(--ec-blue); font-size:18px; }
.ec-faq-item.is-open .plus{ transform:rotate(45deg); }
.ec-faq-a{ max-height:0; overflow:hidden; transition:.25s; font-size:14px; color:var(--ec-ink-soft); line-height:1.6; }
.ec-faq-item.is-open .ec-faq-a{ max-height:300px; padding-bottom:16px; }

/* sticky sidebar apply card */
.ec-sticky{ position:sticky; top:24px; }
.ec-apply-card{ background:var(--ec-navy); color:var(--ec-white); border-radius:var(--ec-radius); padding:24px; }
.ec-apply-card h3{ color:var(--ec-white); font-size:17px; }
.ec-apply-card .row{ display:flex; justify-content:space-between; font-size:13.5px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.14); }
.ec-apply-card .row span:first-child{ color:rgba(255,255,255,0.65); }
.ec-apply-card .ec-btn{ width:100%; justify-content:center; margin-top:16px; }
.ec-apply-card .ec-btn + .ec-btn{ margin-top:10px; }

/* enquiry form */
.ec-form{ display:flex; flex-direction:column; gap:12px; }
.ec-form input, .ec-form textarea, .ec-form select{
  width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--ec-line);
  font-family:inherit; font-size:14px; background:var(--ec-bg);
}
.ec-form label{ font-size:12.5px; font-weight:700; color:var(--ec-navy); margin-bottom:4px; display:block; }
.ec-form-msg{ font-size:13px; color:var(--ec-blue); font-weight:600; }

/* related courses */
.ec-related-strip{ display:flex; gap:16px; overflow-x:auto; padding-bottom:8px; }
.ec-related-strip .ec-card{ min-width:250px; }

/* skeleton loaders */
.ec-skeleton{ background:linear-gradient(90deg,#e7eef4 25%,#f2f7fb 37%,#e7eef4 63%); background-size:400% 100%; animation:ec-shimmer 1.4s ease infinite; border-radius:12px; }
@keyframes ec-shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

/* homepage bits */
.ec-hero-home{
  background: linear-gradient(160deg,var(--ec-navy),var(--ec-navy-2));
  color:var(--ec-white); padding:96px 0 120px; position:relative; overflow:hidden;
}
.ec-hero-home .stripes{
  position:absolute; inset:0; opacity:.08;
  background:repeating-linear-gradient(115deg,var(--ec-blue-light) 0 2px,transparent 2px 34px);
}
.ec-stat-row{ display:flex; gap:34px; margin-top:36px; flex-wrap:wrap; }
.ec-stat b{ font-family:var(--ec-font-mono); font-size:26px; display:block; color:var(--ec-white); }
.ec-stat span{ font-size:12.5px; color:rgba(255,255,255,0.7); }

.ec-why-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:20px; }
.ec-why-card{ background:var(--ec-white); border-radius:var(--ec-radius); padding:24px; border:1px solid var(--ec-line); box-shadow:var(--ec-shadow-sm); }
.ec-why-card .n{ font-family:var(--ec-font-mono); color:var(--ec-blue-light); background:var(--ec-navy); width:36px;height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:700; margin-bottom:14px; }

.ec-process-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:0; position:relative; }
.ec-process-step{ padding:0 18px; position:relative; }
.ec-process-step:not(:last-child)::after{
  content:""; position:absolute; top:18px; right:-6px; width:12px; height:1px; background:var(--ec-line);
}
.ec-process-step .idx{ font-family:var(--ec-font-mono); color:var(--ec-blue); font-weight:700; font-size:13px; }
.ec-process-step h4{ font-size:15px; margin:10px 0 6px; }
.ec-process-step p{ font-size:13px; color:var(--ec-ink-soft); }

.ec-testi-card{ background:var(--ec-white); border-radius:var(--ec-radius); padding:24px; border:1px solid var(--ec-line); box-shadow:var(--ec-shadow-sm); }
.ec-testi-card p{ font-size:14.5px; color:var(--ec-ink); line-height:1.6; }
.ec-testi-who{ display:flex; align-items:center; gap:10px; margin-top:14px; }
.ec-testi-avatar{ width:38px; height:38px; border-radius:50%; background:var(--ec-blue-light); display:flex; align-items:center; justify-content:center; color:var(--ec-white); font-weight:700; font-family:var(--ec-font-mono); }

/* dark mode (toggle-based) */
.ec-scope.ec-dark{ --ec-bg:#0B1620; --ec-white:#12202E; --ec-ink:#EAF2F8; --ec-ink-soft:#93A9BC; --ec-line: rgba(255,255,255,0.09); }
.ec-scope.ec-dark .ec-card, .ec-scope.ec-dark .ec-panel, .ec-scope.ec-dark .ec-why-card, .ec-scope.ec-dark .ec-testi-card{ background:#16283A; }
.ec-scope.ec-dark .ec-info-item, .ec-scope.ec-dark .ec-module-list li{ background:#0F2032; }
.ec-scope.ec-dark h1, .ec-scope.ec-dark h2, .ec-scope.ec-dark h3, .ec-scope.ec-dark h4{ color:#EAF2F8; }
.ec-scope.ec-dark .ec-search-panel{ background:#16283A; }

/* responsive */
@media (max-width: 900px){
  .ec-detail-layout{ grid-template-columns:1fr; }
  .ec-mm-grid{ grid-template-columns:repeat(2,1fr); }
  .ec-process-strip{ grid-template-columns:1fr 1fr; gap:20px; }
  .ec-process-step:not(:last-child)::after{ display:none; }
}
@media (max-width: 640px){
  .ec-search{ width:200px; }
  .ec-megamenu{ width:94vw; left:50%; padding:18px; }
  .ec-mm-grid{ grid-template-columns:1fr; }
  .ec-info-grid{ grid-template-columns:1fr; }
  .ec-process-strip{ grid-template-columns:1fr; }
}

@media (prefers-reduced-motion: reduce){
  .ec-scope *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}


/* ---- styles for the MOCK EXISTING SITE ONLY (not part of the module) ---- */
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;}
.site-header{
  background:var(--ec-navy, #0A2540); position:sticky; top:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between; padding:14px 28px;
}
.site-header .brand{ color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; display:flex; align-items:center; gap:8px; }

function slugify(str) {
  return str.toLowerCase().trim().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function mkCourse(c) {
  return {
    id: slugify(c.title),
    slug: slugify(c.title),
    code: "EOSH-" + slugify(c.title).split("-").map(s => s[0]).join("").toUpperCase().slice(0, 6),
    certification: "Internationally recognised EOSH-style certificate of achievement, ISO/IEC 17024-aligned.",
    assessment: "Multiple-choice knowledge check and, where indicated, a practical/observed competence assessment.",
    eligibility: "Open to employees, supervisors and managers in relevant sectors. No formal prerequisites unless stated.",
    careers: ["Site Safety Officer", "HSE Coordinator", "Operations Supervisor", "Compliance Auditor"],
    faqs: [
      { q: "Is this course accredited?", a: "Yes — the qualification follows an ISO/IEC 17024:2012-aligned certification scheme." },
      { q: "How is the course delivered?", a: c.mode + "." },
      { q: "How long is the certificate valid?", a: "Typically 3 years, after which a refresher assessment is recommended." },
    ],
    ...c,
  };
}
function buildSearchIndex(categories) {
  const index = [];
  categories.forEach(cat => {
    index.push({ type: "category", label: cat.name, sub: cat.cluster, slug: cat.slug, icon: cat.icon });
    cat.courses.forEach(course => {
      index.push({
        type: "course",
        label: course.title,
        sub: cat.name + " · " + course.level,
        slug: cat.slug + "/" + course.slug,
        icon: cat.icon,
        keywords: [course.level, course.mode, cat.name].join(" "),
      });
    });
  });
  return index;
}



const SEARCH_INDEX = buildSearchIndex(COURSE_CATEGORIES);

// UMD-ish export so this works as a plain script tag or a module
if (typeof module !== "undefined" && module.exports) {
  module.exports = { COURSE_CATEGORIES, SEARCH_INDEX, slugify };
} else {
  window.COURSE_CATEGORIES = COURSE_CATEGORIES;
  window.SEARCH_INDEX = SEARCH_INDEX;
  window.slugify = slugify;
}

<script>
/**
 * EOSH-STYLE COURSES MODULE
 * -------------------------
 * Vanilla JS, no build step. Depends on courses-data.js being loaded first.
 * Designed to be appended to an existing site. See README.md for the
 * exact markup and initialisation snippet.
 *
 * Routing is hash-based (#/courses, #/courses/:category, #/course/:category/:slug)
 * so it can be dropped into any existing site without a server/router change.
 */

(function (global) {
  const CATEGORIES = global.COURSE_CATEGORIES || [];

  function $(sel, root) { return (root || document).querySelector(sel); }
  function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function highlight(text, query) {
    if (!query) return escapeHtml(text);
    const q = query.trim();
    if (!q) return escapeHtml(text);
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0, idx)) + "<mark>" + escapeHtml(text.slice(idx, idx + q.length)) + "</mark>" + escapeHtml(text.slice(idx + q.length));
  }
  function getCategory(slug) { return CATEGORIES.find(c => c.slug === slug); }
  function getCourse(catSlug, courseSlug) {
    const cat = getCategory(catSlug);
    return cat ? cat.courses.find(c => c.slug === courseSlug) : null;
  }
  function recentSearches() {
    try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch (e) { return []; }
  }
  function pushRecentSearch(term) {
    if (!term || !term.trim()) return;
    let list = recentSearches().filter(t => t.toLowerCase() !== term.toLowerCase());
    list.unshift(term);
    list = list.slice(0, 5);
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch (e) {}
  }

  // clusters for the mega menu, derived from data
  function clusters() {
    const map = {};
    CATEGORIES.forEach(c => {
      (map[c.cluster] = map[c.cluster] || []).push(c);
    });
    return map;
  }

  // ---------------------------------------------------------------- header
  function renderHeaderAddon() {
    const mount = $(cfg.headerMount);
    if (!mount) return;
    mount.innerHTML = "";
    mount.appendChild(el(`
      <div class="ec-header-add ec-scope">

            Courses
            <svg viewBox="0 0 12 8" fill="none"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <div class="ec-megamenu" id="ec-megamenu"></div>
        </div>
        <div class="ec-search" id="ec-search">
          <div class="ec-search-input-wrap">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M18 18L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input class="ec-search-input" id="ec-search-input" placeholder="Search courses, qualifications…" autocomplete="off" aria-label="Search courses">
          </div>
          <div class="ec-search-panel" id="ec-search-panel"></div>
        </div>
      </div>
    `));

    buildMegaMenu();
    wireCoursesNav();
    wireSearch();
  }

  function buildMegaMenu() {
    const mm = $("#ec-megamenu");
    const cl = clusters();
    const clusterHtml = Object.keys(cl).map(name => `
      <div class="ec-mm-cluster">
        <h4>${escapeHtml(name)}</h4>
        <ul>
          ${cl[name].map(c => `
            <li><a class="ec-mm-link" href="#/courses/${c.slug}"><span class="ic">${c.icon}</span>${escapeHtml(c.name)}</a></li>
          `).join("")}
        </ul>
      </div>
    `).join("");

    const totalCourses = CATEGORIES.reduce((n, c) => n + c.courses.length, 0);
    mm.innerHTML = `
      <div class="ec-mm-grid">${clusterHtml}</div>
      <div class="ec-mm-foot">
        <span class="ec-mm-stat">${CATEGORIES.length} categories · ${totalCourses} listed courses and growing</span>
        <a class="ec-mm-cta" href="#/courses">Browse all courses →</a>
      </div>
    `;
  }

  function wireCoursesNav() {
    const trigger = $("#ec-courses-trigger");
    const menu = $("#ec-megamenu");
    const navItem = $("#ec-courses-nav");
    function open() { menu.classList.add("is-open"); trigger.classList.add("is-open"); trigger.setAttribute("aria-expanded", "true"); }
    function close() { menu.classList.remove("is-open"); trigger.classList.remove("is-open"); trigger.setAttribute("aria-expanded", "false"); }
    let hoverTimer;
    trigger.addEventListener("click", () => menu.classList.contains("is-open") ? close() : open());
    navItem.addEventListener("mouseenter", () => { clearTimeout(hoverTimer); open(); });
    navItem.addEventListener("mouseleave", () => { hoverTimer = setTimeout(close, 180); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
    document.addEventListener("click", e => { if (!navItem.contains(e.target)) close(); });
  }

  // ---------------------------------------------------------------- search
  function wireSearch() {
    const input = $("#ec-search-input");
    const panel = $("#ec-search-panel");
    let activeIndex = -1;
    let currentResults = [];
    let activeFilter = null;

    function renderPanel(query) {
      const q = (query || "").trim();
      let results = INDEX;
      if (activeFilter) results = results.filter(r => r.sub.toLowerCase().includes(activeFilter.toLowerCase()) || r.label.toLowerCase().includes(activeFilter.toLowerCase()));
      if (q) {
        results = results.filter(r => (r.label + " " + r.sub + " " + (r.keywords || "")).toLowerCase().includes(q.toLowerCase()));
      }
      currentResults = results.slice(0, 8);
      activeIndex = -1;

      const chipsHtml = `<div class="ec-search-chips">
        ${["All", ...CATEGORIES.slice(0, 6).map(c => c.name)].map(name => `
          <button class="ec-chip ${activeFilter === name || (name === "All" && !activeFilter) ? "is-active" : ""}" data-filter="${name === "All" ? "" : escapeHtml(name)}" type="button">${escapeHtml(name)}</button>
        `).join("")}
      </div>`;

      if (!q && !activeFilter) {
        const recents = recentSearches();
        panel.innerHTML = chipsHtml +
          (recents.length ? `<div class="ec-search-section-label">Recent searches</div>` +
            recents.map(r => `<div class="ec-result" data-term="${escapeHtml(r)}"><span class="ic">🕘</span><div><div class="rt">${escapeHtml(r)}</div></div></div>`).join("") : "") +
          `<div class="ec-search-section-label">Popular searches</div>` +
          POPULAR.map(r => `<div class="ec-result" data-term="${escapeHtml(r)}"><span class="ic">🔥</span><div><div class="rt">${escapeHtml(r)}</div></div></div>`).join("");
        return;
      }

      if (currentResults.length === 0) {
        panel.innerHTML = chipsHtml + `
          <div class="ec-search-empty">
            <strong>No results found</strong>
            Try a different keyword, or browse categories from the Courses menu.
          </div>`;
        return;
      }

      panel.innerHTML = chipsHtml + currentResults.map((r, i) => `
        <div class="ec-result ${i === activeIndex ? "is-active" : ""}" data-idx="${i}">
          <span class="ic">${r.icon || "📘"}</span>
          <div><div class="rt">${highlight(r.label, q)}</div><div class="rs">${escapeHtml(r.sub)}</div></div>
        </div>
      `).join("");
    }

    function openPanel() { panel.classList.add("is-open"); renderPanel(input.value); }
    function closePanel() { panel.classList.remove("is-open"); }

    function go(result) {
      pushRecentSearch(result.label);
      if (result.type === "category") location.hash = "#/courses/" + result.slug;
      else location.hash = "#/course/" + result.slug;
      input.value = "";
      closePanel();
    }

    input.addEventListener("focus", openPanel);
    input.addEventListener("input", () => renderPanel(input.value));
    input.addEventListener("keydown", e => {
      const rows = panel.querySelectorAll(".ec-result[data-idx]");
      if (e.key === "ArrowDown") { e.preventDefault(); activeIndex = Math.min(activeIndex + 1, rows.length - 1); renderPanel(input.value); }
      else if (e.key === "ArrowUp") { e.preventDefault(); activeIndex = Math.max(activeIndex - 1, 0); renderPanel(input.value); }
      else if (e.key === "Enter") {
        e.preventDefault();
        if (activeIndex >= 0 && currentResults[activeIndex]) go(currentResults[activeIndex]);
        else if (input.value.trim()) { pushRecentSearch(input.value.trim()); location.hash = "#/courses?q=" + encodeURIComponent(input.value.trim()); closePanel(); }
      } else if (e.key === "Escape") { closePanel(); input.blur(); }
    });

    panel.addEventListener("click", e => {
      const chip = e.target.closest(".ec-chip");
      if (chip) { activeFilter = chip.dataset.filter || null; renderPanel(input.value); return; }
      const result = e.target.closest(".ec-result");
      if (!result) return;
      if (result.dataset.term) { input.value = result.dataset.term; pushRecentSearch(result.dataset.term); location.hash = "#/courses?q=" + encodeURIComponent(result.dataset.term); closePanel(); return; }
      const idx = Number(result.dataset.idx);
      if (currentResults[idx]) go(currentResults[idx]);
    });

    document.addEventListener("click", e => { if (!$("#ec-search").contains(e.target)) closePanel(); });
  }

  // ---------------------------------------------------------------- router
  const routes = [
    { test: h => h === "" || h === "/" || h === "/courses-home", render: renderCoursesHome },
    { test: h => h.startsWith("/courses/"), render: renderCategoryPage },
    { test: h => h.startsWith("/courses"), render: renderCoursesHub },
    { test: h => h.startsWith("/course/"), render: renderCoursePage },
  ];

  function parseHash() {
    const raw = location.hash.replace(/^#/, "") || "/courses-home";
    const [path, qs] = raw.split("?");
    const params = new URLSearchParams(qs || "");
    return { path, params };
  }

  function router() {
    const app = $(cfg.appMount);
    if (!app) return;
    const { path, params } = parseHash();
    const match = routes.find(r => r.test(path)) || routes[0];
    app.innerHTML = `<div class="ec-scope">${loadingSkeleton()}</div>`;
    // simulate light async paint so skeletons are visible then content swaps in
    requestAnimationFrame(() => {
      app.innerHTML = `<div class="ec-scope">${match.render(path, params)}</div>`;
      wirePageInteractions(app, path, params);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  function loadingSkeleton() {
    return `<div class="ec-section"><div class="ec-container">
      <div class="ec-skeleton" style="height:220px;margin-bottom:24px;"></div>
      <div class="ec-grid">${Array.from({length:6}).map(()=>`<div class="ec-skeleton" style="height:190px;"></div>`).join("")}</div>
    </div></div>`;
  }

  // ------------------------------------------------------- page: courses hub
  function renderCoursesHub(path, params) {
    const q = params.get("q") || "";
    let allCourses = [];
    CATEGORIES.forEach(cat => cat.courses.forEach(course => allCourses.push({ cat, course })));
    if (q) {
      allCourses = allCourses.filter(({ cat, course }) => (course.title + " " + cat.name + " " + course.level).toLowerCase().includes(q.toLowerCase()));
    }
    const pageSize = 9;
    const page = Math.max(1, parseInt(params.get("page") || "1", 10));
    const totalPages = Math.max(1, Math.ceil(allCourses.length / pageSize));
    const pageItems = allCourses.slice((page - 1) * pageSize, page * pageSize);

    return `
      ${heroBlock({
        eyebrow: "Course Catalogue",
        title: q ? `Results for “${escapeHtml(q)}”` : "All Courses & Qualifications",
        lede: "Every certified qualification across our safety, health, environment and compliance catalogue — searchable and filterable in one place.",
      })}
      <section class="ec-section">
        <div class="ec-container">
          <div class="ec-filter-row" style="margin-bottom:28px;">
            <a class="ec-chip ${!q ? "is-active" : ""}" href="#/courses">All</a>
            ${CATEGORIES.slice(0, 10).map(c => `<a class="ec-chip" href="#/courses/${c.slug}">${escapeHtml(c.name)}</a>`).join("")}
          </div>
          ${pageItems.length ? `<div class="ec-grid">${pageItems.map(({ cat, course }) => courseCard(cat, course)).join("")}</div>`
            : `<div class="ec-search-empty" style="padding:60px 0;"><strong>No results found</strong>Try a broader search term or browse a category above.</div>`}
          ${totalPages > 1 ? paginationHtml(page, totalPages, "#/courses" + (q ? "?q=" + encodeURIComponent(q) + "&" : "?") ) : ""}
        </div>
      </section>
    `;
  }

  function paginationHtml(page, totalPages, base) {
    let out = `<div style="display:flex;gap:8px;justify-content:center;margin-top:36px;">`;
    for (let i = 1; i <= totalPages; i++) {
      out += `<a class="ec-chip ${i === page ? "is-active" : ""}" href="${base}page=${i}">${i}</a>`;
    }
    out += `</div>`;
    return out;
  }

  // ------------------------------------------------------- page: category
  function renderCategoryPage(path) {
    const slug = path.split("/")[2];
    const cat = getCategory(slug);
    if (!cat) return notFound("Category");
    return `
      ${heroBlock({
        eyebrow: cat.cluster,
        title: cat.name,
        lede: cat.blurb,
        crumbs: [["Courses", "#/courses"], [cat.name, null]],
      })}
      <section class="ec-section">
        <div class="ec-container">
          <div class="ec-section-head">
            <div><span class="ec-eyebrow">Available Courses</span><h2>${escapeHtml(cat.name)} qualifications</h2></div>
          </div>
          ${cat.courses.length ? `<div class="ec-grid">${cat.courses.map(course => courseCard(cat, course)).join("")}</div>` : `
            <div class="ec-pending-card ec-card">
              <div class="ec-card-icon" style="margin-bottom:14px;">${cat.icon}</div>
              <h3>Full syllabus available on request</h3>
              <p>This category's detailed course-by-course listing is being finalised for the catalogue. Our admissions team can send the current syllabus and pricing directly.</p>
              <p class="ec-pending-note">Speak to admissions →</p>
            </div>
          `}
        </div>
      </section>
    `;
  }

  // ------------------------------------------------------- page: course detail
  function renderCoursePage(path) {
    const parts = path.split("/"); // /course/:catSlug/:courseSlug
    const catSlug = parts[2], courseSlug = parts[3];
    const cat = getCategory(catSlug);
    const course = cat ? getCourse(catSlug, courseSlug) : null;
    if (!cat || !course) return notFound("Course");

    const related = cat.courses.filter(c => c.slug !== course.slug).slice(0, 4);

    return `
      ${heroBlock({
        eyebrow: cat.name + " · " + course.level,
        title: course.title,
        lede: course.summary,
        crumbs: [["Courses", "#/courses"], [cat.name, "#/courses/" + cat.slug], [course.title, null]],
        badges: [course.duration, course.mode, course.code],
        actions: true,
      })}
      <section class="ec-section" style="padding-top:48px;">
        <div class="ec-container ec-detail-layout">
          <div>
            <div class="ec-panel">
              <h2>Course Overview</h2>
              <p style="color:var(--ec-ink-soft);line-height:1.7;font-size:14.5px;">${escapeHtml(course.summary)} This qualification is delivered against an ISO/IEC 17024-aligned competence framework, combining structured learning with applied assessment so certificate holders can demonstrate real workplace capability, not just attendance.</p>
            </div>
            <div class="ec-panel">
              <h2>Learning Outcomes</h2>
              <ul class="ec-outcome-list">${course.outcomes.map(o => `<li>${escapeHtml(o)}</li>`).join("")}</ul>
            </div>
            <div class="ec-panel">
              <h2>Syllabus &amp; Modules</h2>
              <ul class="ec-module-list">${course.modules.map(m => `<li>${escapeHtml(m)}</li>`).join("")}</ul>
            </div>
            <div class="ec-panel">
              <h2>Career Opportunities</h2>
              <div class="ec-filter-row">${course.careers.map(c => `<span class="ec-chip">${escapeHtml(c)}</span>`).join("")}</div>
            </div>
            <div class="ec-panel">
              <h2>Frequently Asked Questions</h2>
              ${course.faqs.map((f, i) => `
                <div class="ec-faq-item" data-faq="${i}">
                  <button class="ec-faq-q"><span>${escapeHtml(f.q)}</span><span class="plus">+</span></button>
                  <div class="ec-faq-a">${escapeHtml(f.a)}</div>
                </div>
              `).join("")}
            </div>
          </div>

          <aside class="ec-sticky">
            <div class="ec-apply-card">
              <h3>${escapeHtml(course.title)}</h3>
              <div class="row"><span>Duration</span><span>${escapeHtml(course.duration)}</span></div>
              <div class="row"><span>Delivery mode</span><span>${escapeHtml(course.mode)}</span></div>
              <div class="row"><span>Level</span><span>${escapeHtml(course.level)}</span></div>
              <div class="row"><span>Certification</span><span style="text-align:right;max-width:180px;">ISO/IEC 17024-aligned</span></div>
            </div>
            <div class="ec-panel" style="margin-top:20px;">
              <h2 style="font-size:15px;">Eligibility</h2>
              <p style="font-size:13.5px;color:var(--ec-ink-soft);">${escapeHtml(course.eligibility)}</p>
            </div>
            <div class="ec-panel">
              <h2 style="font-size:15px;">Assessment</h2>
              <p style="font-size:13.5px;color:var(--ec-ink-soft);">${escapeHtml(course.assessment)}</p>
            </div>
            <div class="ec-panel" id="ec-enquiry-panel">
              <h2>Enquire About This Course</h2>
              <form class="ec-form" id="ec-enquiry-form">
                <div><label>Full name</label><input required name="name" placeholder="Enter yor name"></div>
                <div><label>Work email</label><input required type="email" name="email" placeholder="Enter yor mail"></div>
                <div><label>Message</label><textarea name="message" rows="3" placeholder="Tell us about your training needs…"></textarea></div>
                <button class="ec-btn ec-btn-primary" type="submit">Send Enquiry</button>
                <div class="ec-form-msg" id="ec-enquiry-msg" role="status"></div>
              </form>
            </div>
          </aside>
        </div>

        ${related.length ? `
        <div class="ec-container" style="margin-top:12px;">
          <div class="ec-section-head"><div><span class="ec-eyebrow">Keep exploring</span><h2>Related Courses</h2></div></div>
          <div class="ec-related-strip">${related.map(c => courseCard(cat, c)).join("")}</div>
        </div>` : ""}
      </section>
    `;
  }

  // ------------------------------------------------------- page: courses homepage sections (demo)
  function renderCoursesHome() {
    const featured = [];
    CATEGORIES.filter(c => c.courses.length).slice(0, 4).forEach(cat => featured.push({ cat, course: cat.courses[0] }));
    const popular = [];
    CATEGORIES.filter(c => c.courses.length).slice(2, 6).forEach(cat => popular.push({ cat, course: cat.courses[cat.courses.length - 1] }));

    return `
      <section class="ec-hero-home">
        <div class="stripes"></div>
        <div class="ec-container">
          <span class="ec-eyebrow" style="color:var(--ec-blue-light);">Accredited Safety &amp; Compliance Training</span>
          <h1 style="color:#fff;font-size:clamp(32px,4.4vw,52px);max-width:720px;">Certification you can verify. Training your teams will actually use.</h1>
          <p class="ec-lede">${CATEGORIES.length} qualification categories, ${CATEGORIES.reduce((n,c)=>n+c.courses.length,0)}+ listed courses — from single-day awareness awards to management-level diplomas.</p>
          <div class="ec-hero-actions">
           
          </div>
          <div class="ec-stat-row">
            <div class="ec-stat"><b>${CATEGORIES.length}</b><span>Course categories</span></div>
            <div class="ec-stat"><b>${CATEGORIES.reduce((n,c)=>n+c.courses.length,0)}+</b><span>Listed qualifications</span></div>
            <div class="ec-stat"><b>17024</b><span>ISO/IEC alignment</span></div>
          </div>
        </div>
      </section>

      

      

      <section class="ec-section">
        <div class="ec-container">
          <div class="ec-section-head"><div><span class="ec-eyebrow">Full catalogue</span><h2>Browse by Category</h2></div></div>
          <div class="ec-grid">${CATEGORIES.slice(0, 12).map(cat => categoryCard(cat)).join("")}</div>
        </div>
      </section>

      <section class="ec-section" style="background:#fff;">
        <div class="ec-container">
          <div class="ec-section-head"><div><span class="ec-eyebrow">Why train here</span><h2>Why Choose Us</h2></div></div>
          <div class="ec-why-grid">
            ${[
              ["01","ISO-aligned certification","Every qualification follows an ISO/IEC 17024:2012-aligned scheme, recognised across sectors."],
              ["02","Flexible delivery","Classroom, blended and online formats so training fits your rota, not the other way round."],
              ["03","Verifiable certificates","Every certificate can be verified online in seconds — no more chasing paperwork."],
              ["04","Sector-specific depth","From oil & gas to rail, courses are built around real operational risk, not generic content."],
            ].map(([n,t,d]) => `<div class="ec-why-card"><div class="n">${n}</div><h3 style="font-size:16px;">${t}</h3><p style="font-size:13.5px;color:var(--ec-ink-soft);">${d}</p></div>`).join("")}
          </div>
        </div>
      </section>


      
    `;
  }

  // ---------------------------------------------------------------- shared bits
  function heroBlock({ eyebrow, title, lede, crumbs, badges, actions }) {
    return `
      <section class="ec-hero">
        <div class="ec-container">
          ${crumbs ? `<div class="ec-breadcrumb">${crumbs.map(([label, href], i) => href ? `<a href="${href}">${escapeHtml(label)}</a> ${i < crumbs.length - 1 ? "/" : ""}` : `<span>${escapeHtml(label)}</span>`).join(" ")}</div>` : ""}
          <span class="ec-eyebrow" style="color:var(--ec-blue-light);">${escapeHtml(eyebrow || "")}</span>
          ${badges ? `<div class="ec-hero-badges">${badges.map(b => `<span class="ec-badge">${escapeHtml(b)}</span>`).join("")}</div>` : ""}
          <h1>${escapeHtml(title)}</h1>
          <p class="ec-lede">${escapeHtml(lede)}</p>
          ${actions ? `<div class="ec-hero-actions">
          
          </div>` : ""}
        </div>
      </section>
    `;
  }

  function courseCard(cat, course) {
    return `
      <a class="ec-card" href="#/course/${cat.slug}/${course.slug}" style="display:block;">
        <div class="ec-card-top"><div class="ec-card-icon">${cat.icon}</div><span class="ec-tab">${escapeHtml(course.level)}</span></div>
        <h3>${escapeHtml(course.title)}</h3>
        <p>${escapeHtml(course.summary)}</p>
        <div class="ec-card-meta"><span>${escapeHtml(course.duration)}</span><span>${escapeHtml(course.mode)}</span></div>
        <div class="ec-card-foot"><span class="ec-code">${escapeHtml(course.code)}</span><span class="ec-link-arrow">View course →</span></div>
      </a>
    `;
  }

  function categoryCard(cat) {
    return `
      <a class="ec-card" href="#/courses/${cat.slug}" style="display:block;">
        <div class="ec-card-top"><div class="ec-card-icon">${cat.icon}</div><span class="ec-tab">${cat.courses.length ? cat.courses.length + " courses" : "New"}</span></div>
        <h3>${escapeHtml(cat.name)}</h3>
        <p>${escapeHtml(cat.blurb)}</p>
        <div class="ec-card-foot"><span class="ec-code">${cat.cluster}</span><span class="ec-link-arrow">Explore →</span></div>
      </a>
    `;
  }

  function notFound(kind) {
    return `<section class="ec-section"><div class="ec-container ec-search-empty" style="padding:100px 0;">
      <strong>${kind} not found</strong>The page you're looking for may have moved. <a href="#/courses" class="ec-link-arrow">Back to all courses →</a>
    </div></div></section>`;
  }

  // ---------------------------------------------------------------- page-level interactions
  function wirePageInteractions(app) {
    app.querySelectorAll(".ec-faq-q").forEach(btn => {
      btn.addEventListener("click", () => btn.parentElement.classList.toggle("is-open"));
    });
    const applyBtn = app.querySelector("#ec-apply-btn");
    const applyBtnTop = app.querySelector("#ec-apply-btn-top");
    [applyBtn, applyBtnTop].forEach(b => b && b.addEventListener("click", () => {
      const target = app.querySelector("#ec-enquiry-panel");
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    }));
    const brochureBtn = app.querySelector("#ec-brochure-btn");
    if (brochureBtn) brochureBtn.addEventListener("click", e => {
      e.preventDefault();
      alert("Brochure download would start here — wire this to your PDF asset or lead-gen endpoint.");
    });
    const form = app.querySelector("#ec-enquiry-form");
    if (form) form.addEventListener("submit", e => {
      e.preventDefault();
      app.querySelector("#ec-enquiry-msg").textContent = "Thanks — an admissions coordinator will be in touch within one business day.";
      form.reset();
    });
  }

  // ---------------------------------------------------------------- init
  function init(options) {
    cfg = Object.assign(cfg, options || {});
    if (cfg.headerMount) renderHeaderAddon();
    if (cfg.appMount) {
      window.addEventListener("hashchange", router);
      router();
    }
  }

  global.EOSHCourses = { init, CATEGORIES, INDEX };
})(window);

</script>
<script>
  EOSHCourses.init({ headerMount: '#ec-header-mount', appMount: '#ec-app' });

  const darkBtn = document.getElementById('dark-toggle');
  darkBtn.addEventListener('click', () => {
    document.querySelectorAll('.ec-scope').forEach(elx => elx.classList.toggle('ec-dark'));
    darkBtn.classList.toggle('active');
    darkBtn.textContent = darkBtn.classList.contains('active') ? '☀️ Light mode' : '🌙 Dark mode';
  });
</script>
</body>
