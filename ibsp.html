<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Skyllz — IBSP Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   EOSH-STYLE COURSES MODULE — visual system
   Palette (as specified): Dark Blue #0A2540 · Light Blue #4DA8DA · Blue #1E88E5 · White #FFFFFF
   Signature idea: courses presented as "certification plates" — a nod to
   compliance placards/data plates, with a monospace course-code chip and a
   corner level-tab, rather than generic flat cards.
   ========================================================================== */

:root{
  --ec-navy: #0A2540;
  --ec-navy-2: #0E2E4D;
  --ec-blue: #1E88E5;
  --ec-blue-light: #4DA8DA;
  --ec-white: #FFFFFF;
  --ec-bg: #F3F8FC;
  --ec-ink: #12202E;
  --ec-ink-soft: #4C6072;
  --ec-line: rgba(10,37,64,0.10);
  --ec-glass: rgba(255,255,255,0.62);
  --ec-glass-navy: rgba(10,37,64,0.55);
  --ec-shadow: 0 20px 45px -20px rgba(10,37,64,0.35);
  --ec-shadow-sm: 0 8px 24px -12px rgba(10,37,64,0.28);
  --ec-radius: 18px;
  --ec-radius-sm: 12px;
  --ec-font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
  --ec-font-body: 'Inter', 'Segoe UI', sans-serif;
  --ec-font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}

.ec-scope{
  font-family: var(--ec-font-body);
  color: var(--ec-ink);
  background: var(--ec-bg);
  -webkit-font-smoothing: antialiased;
}
.ec-scope *{ box-sizing: border-box; }
.ec-scope h1,.ec-scope h2,.ec-scope h3,.ec-scope h4{
  font-family: var(--ec-font-display);
  letter-spacing: -0.01em;
  margin: 0 0 .5em;
  color: var(--ec-navy);
}
.ec-scope a{ color: inherit; text-decoration: none; }
.ec-scope button{ font-family: inherit; cursor: pointer; }
.ec-container{ max-width: 1180px; margin: 0 auto; padding: 0 24px; }
.ec-visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }


.ec-related-strip {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  max-width: 100%;
  padding-bottom: 10px;
}

.ec-related-strip .ec-card {
  flex: 0 0 auto;
  min-width: 250px; /* adjust if needed */
}

/* Optional: prevent page from going wider than screen */
body {
  overflow-x: hidden;
}
/* ---------- Header addition ---------- */
.ec-header-add{
  display:flex; align-items:center; gap:10px; position:relative;
}
.ec-nav-item{
  position:relative;
}
.ec-nav-trigger{
  display:flex; align-items:center; gap:6px;
  background:none; border:none; color:var(--ec-white);
  font-family: var(--ec-font-display); font-size:15px; font-weight:600;
  padding:10px 14px; border-radius:10px; transition:.2s background;
}
.ec-nav-trigger:hover, .ec-nav-trigger.is-open{ background:rgba(255,255,255,0.12); }
.ec-nav-trigger svg{ width:12px; height:12px; transition:.25s transform; }
.ec-nav-trigger.is-open svg{ transform:rotate(180deg); }

/* ---------- Mega menu ---------- */
.ec-megamenu{
  position:absolute; top:calc(100% + 14px); left:50%; transform:translate(-50%,8px);
  width:min(920px, 92vw);
  background: var(--ec-glass);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,0.5);
  border-radius: 22px;
  box-shadow: var(--ec-shadow);
  padding:26px;
  opacity:0; visibility:hidden; pointer-events:none;
  transition: opacity .22s ease, transform .22s ease, visibility .22s;
  z-index:80;
}
.ec-megamenu.is-open{ opacity:1; visibility:visible; pointer-events:auto; transform:translate(-50%,0); }
.ec-mm-grid{
  display:grid; grid-template-columns: repeat(3,1fr); gap:22px 26px;
}
.ec-mm-cluster h4{
  font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  color: var(--ec-blue); margin-bottom:10px; font-weight:700;
}
.ec-mm-cluster ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.ec-mm-link{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:10px;
  font-size:14px; color:var(--ec-ink); transition:.15s background,.15s transform;
}
.ec-mm-link:hover{ background:rgba(30,136,229,0.10); transform:translateX(2px); }
.ec-mm-link .ic{ font-size:15px; }
.ec-mm-foot{
  margin-top:20px; padding-top:18px; border-top:1px solid var(--ec-line);
  display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
}
.ec-mm-cta{
  background: var(--ec-navy); color:var(--ec-white); padding:10px 18px; border-radius:12px;
  font-weight:600; font-size:14px; transition:.2s background;
}
.ec-mm-cta:hover{ background: var(--ec-blue); }
.ec-mm-stat{ font-family:var(--ec-font-mono); font-size:12.5px; color:var(--ec-ink-soft); }

/* ---------- Search ---------- */
.ec-search{ position:relative; width:600px; }
.ec-search-input-wrap{
  display:flex; align-items:center; gap:8px;
  background: rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.25);
  border-radius:12px; padding:9px 12px; transition:.2s;
  position:relative;
}
.ec-search:hover .ec-search-input-wrap,
.ec-search-input-wrap:hover{
  background: rgba(255,255,255,0.24);
  border-color: rgba(255,255,255,0.48);
  box-shadow: 0 0 0 2px rgba(77,168,218,0.22), 0 10px 20px rgba(0,0,0,0.16);
  transform: translateY(-1px);
}
.ec-search-input-wrap:focus-within{
  background: var(--ec-white); border-color: var(--ec-white);
  box-shadow: 0 0 0 3px rgba(77,168,218,0.45);
}
.ec-search-input-wrap svg{ width:15px; height:15px; flex-shrink:0; color:rgba(255,255,255,0.85); }
.ec-search-input-wrap:focus-within svg{ color: var(--ec-navy); }
.ec-search-input{
  background:none; border:none; outline:none; color:var(--ec-white); font-size:14px; width:100%; flex:1 1 auto; min-width:0;
}
.ec-search-input-wrap:focus-within .ec-search-input{ color:var(--ec-navy); }
.ec-search-input::placeholder{ color:rgba(255,255,255,0.7); }
.ec-search-input-wrap:focus-within .ec-search-input::placeholder{ color:var(--ec-ink-soft); }
.ec-search-btn{
  border:none; border-radius:999px; padding:7px 12px; margin-left:4px;
  background: rgba(255,255,255,0.92); color:var(--ec-navy); font-size:12px; font-weight:700;
  cursor:pointer; white-space:nowrap; opacity:0; pointer-events:none;
  transform:translateX(4px); transition:.2s ease;
}
.ec-search:hover .ec-search-btn,
.ec-search:focus-within .ec-search-btn,
.ec-search-input-wrap:hover .ec-search-btn{
  opacity:1; pointer-events:auto; transform:translateX(0);
}

.ec-search-panel{
  position:absolute; top:calc(100% + 10px); left:0; width:520px; max-width:92vw;
  background:var(--ec-white); border-radius:16px; box-shadow:var(--ec-shadow);
  border:1px solid var(--ec-line); padding:10px; z-index:90;
  opacity:0; visibility:hidden; transform:translateY(6px); transition:.18s;
  max-height:min(70vh, 520px); overflow-y:auto;
}
.ec-search-panel.is-open{ opacity:1; visibility:visible; transform:translateY(0); }
.ec-search-section-label{
  font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ec-ink-soft);
  padding:10px 12px 4px; font-weight:700;
}
.ec-search-chips{ display:flex; flex-wrap:wrap; gap:6px; padding:6px 10px 10px; }
.ec-chip{
  font-size:12.5px; padding:6px 11px; border-radius:999px; background:var(--ec-bg);
  border:1px solid var(--ec-line); color:var(--ec-navy); font-weight:600; transition:.15s;
}
.ec-chip:hover, .ec-chip.is-active{ background:var(--ec-blue); color:var(--ec-white); border-color:var(--ec-blue); }
.ec-result{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px; cursor:pointer;
}
.ec-result:hover, .ec-result.is-active{ background: rgba(30,136,229,0.09); }
.ec-result .ic{
  width:34px; height:34px; border-radius:10px; background:var(--ec-bg); display:flex; align-items:center;
  justify-content:center; font-size:16px; flex-shrink:0;
}
.ec-result .rt{ font-size:14px; font-weight:600; color:var(--ec-ink); }
.ec-result .rs{ font-size:12px; color:var(--ec-ink-soft); }
.ec-result mark{ background: rgba(77,168,218,0.35); color:inherit; border-radius:3px; padding:0 1px; }
.ec-search-empty{ padding:26px 16px; text-align:center; color:var(--ec-ink-soft); font-size:13.5px; }
.ec-search-empty strong{ display:block; color:var(--ec-navy); font-size:14.5px; margin-bottom:4px; }

/* ---------- Category pill filter row ---------- */
.ec-filter-row{ display:flex; flex-wrap:wrap; gap:8px; }

/* ---------- Course / category cards (the "certification plate") ---------- */
.ec-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:22px; }
.ec-card{
  position:relative; background:var(--ec-white); border-radius:var(--ec-radius);
  border:1px solid var(--ec-line); padding:22px; box-shadow:var(--ec-shadow-sm);
  transition:.25s transform,.25s box-shadow; overflow:hidden;
}
.ec-card::before{
  content:""; position:absolute; inset:0 0 auto 0; height:4px;
  background:linear-gradient(90deg,var(--ec-blue),var(--ec-blue-light));
}
.ec-card:hover{ transform:translateY(-5px); box-shadow:var(--ec-shadow); }
.ec-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px; }
.ec-card-icon{
  width:44px; height:44px; border-radius:12px; background:var(--ec-bg); display:flex; align-items:center;
  justify-content:center; font-size:20px;
}
.ec-tab{
  font-family:var(--ec-font-mono); font-size:11px; font-weight:600; color:var(--ec-blue);
  background: rgba(30,136,229,0.10); border-radius:999px; padding:4px 10px; white-space:nowrap;
}
.ec-card h3{ font-size:17px; margin-bottom:6px; }
.ec-card p{ font-size:13.5px; color:var(--ec-ink-soft); line-height:1.5; margin:0 0 14px; }
.ec-card-meta{ display:flex; gap:14px; font-size:12px; color:var(--ec-ink-soft); font-family:var(--ec-font-mono); margin-bottom:14px; }
.ec-card-foot{ display:flex; justify-content:space-between; align-items:center; }
.ec-code{ font-family:var(--ec-font-mono); font-size:11px; color:var(--ec-ink-soft); letter-spacing:.04em; }
.ec-link-arrow{ font-weight:700; font-size:13px; color:var(--ec-blue); display:flex; align-items:center; gap:4px; }
.ec-link-arrow:hover{ text-decoration:underline; }

.ec-pending-card{
  border:1.5px dashed rgba(10,37,64,0.22); background:rgba(255,255,255,0.5);
}
.ec-pending-card p.ec-pending-note{ font-size:12.5px; color:var(--ec-blue); font-weight:600; }

/* ---------- Section shell ---------- */
.ec-section{ padding:64px 0; }
.ec-eyebrow{
  font-family:var(--ec-font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ec-blue); font-weight:700; margin-bottom:10px; display:block;
}
.ec-section-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:32px; flex-wrap:wrap; }
.ec-section-head h2{ font-size:30px; }
.ec-section-head p{ color:var(--ec-ink-soft); max-width:520px; margin:0; }

/* ---------- Hero (course/category pages) ---------- */
.ec-hero{
  background: radial-gradient(1100px 460px at 15% -10%, rgba(77,168,218,0.35), transparent),
              linear-gradient(160deg,var(--ec-navy),var(--ec-navy-2) 70%);
  color:var(--ec-white); padding:74px 0 90px; position:relative; overflow:hidden;
}
.ec-hero::after{
  content:""; position:absolute; right:-8%; top:-20%; width:520px; height:520px; border-radius:50%;
  background: radial-gradient(circle at 30% 30%, rgba(77,168,218,0.35), transparent 65%);
}
.ec-breadcrumb{ font-size:13px; color:rgba(255,255,255,0.75); margin-bottom:22px; display:flex; gap:8px; flex-wrap:wrap; }
.ec-breadcrumb a:hover{ text-decoration:underline; }
.ec-hero-badges{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.ec-badge{
  font-family:var(--ec-font-mono); font-size:12px; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); padding:6px 12px; border-radius:999px;
}
.ec-hero h1{ color:var(--ec-white); font-size:clamp(30px,4vw,46px); max-width:760px; }
.ec-hero .ec-lede{ color:rgba(255,255,255,0.82); max-width:640px; font-size:16px; line-height:1.6; }
.ec-hero-actions{ display:flex; gap:14px; margin-top:28px; flex-wrap:wrap; }
.ec-btn{
  display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:12px;
  font-weight:700; font-size:14.5px; border:1px solid transparent; transition:.2s;
}
.ec-btn-primary{ background:var(--ec-blue); color:var(--ec-white); }
.ec-btn-primary:hover{ background:#166fc0; }
.ec-btn-ghost{ background:rgba(255,255,255,0.1); color:var(--ec-white); border-color:rgba(255,255,255,0.3); }
.ec-btn-ghost:hover{ background:rgba(255,255,255,0.2); }
.ec-btn-outline-dark{ background:transparent; color:var(--ec-navy); border-color:var(--ec-navy); }
.ec-btn-outline-dark:hover{ background:var(--ec-navy); color:var(--ec-white); }

/* ---------- Course detail layout ---------- */
.ec-detail-layout{ display:grid; grid-template-columns: 1fr 340px; gap:40px; align-items:start; }
.ec-panel{
  background:var(--ec-white); border:1px solid var(--ec-line); border-radius:var(--ec-radius);
  padding:26px; box-shadow:var(--ec-shadow-sm); margin-bottom:24px;
}
.ec-panel h2{ font-size:19px; }
.ec-outcome-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.ec-outcome-list li{ display:flex; gap:10px; font-size:14.5px; line-height:1.5; }
.ec-outcome-list li::before{ content:"✓"; color:var(--ec-blue); font-weight:800; flex-shrink:0; }
.ec-module-list{ list-style:none; margin:0; padding:0; counter-reset:mod; display:flex; flex-direction:column; gap:8px; }
.ec-module-list li{
  counter-increment:mod; display:flex; gap:12px; align-items:baseline; font-size:14.5px;
  padding:12px 14px; background:var(--ec-bg); border-radius:10px;
}
.ec-module-list li::before{
  content:counter(mod,decimal-leading-zero); font-family:var(--ec-font-mono); color:var(--ec-blue); font-weight:700; font-size:12px;
}
.ec-info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.ec-info-item{ background:var(--ec-bg); border-radius:12px; padding:14px; }
.ec-info-item .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ec-ink-soft); font-weight:700; }
.ec-info-item .val{ font-family:var(--ec-font-mono); font-size:14.5px; color:var(--ec-navy); margin-top:3px; }

.ec-faq-item{ border-bottom:1px solid var(--ec-line); }
.ec-faq-q{
  width:100%; text-align:left; background:none; border:none; padding:15px 4px; display:flex;
  justify-content:space-between; align-items:center; font-weight:600; font-size:14.5px; color:var(--ec-navy);
}
.ec-faq-q .plus{ transition:.2s transform; color:var(--ec-blue); font-size:18px; }
.ec-faq-item.is-open .plus{ transform:rotate(45deg); }
.ec-faq-a{ max-height:0; overflow:hidden; transition:.25s; font-size:14px; color:var(--ec-ink-soft); line-height:1.6; }
.ec-faq-item.is-open .ec-faq-a{ max-height:300px; padding-bottom:16px; }

/* sticky sidebar apply card */
.ec-sticky{ position:sticky; top:24px; }
.ec-apply-card{ background:var(--ec-navy); color:var(--ec-white); border-radius:var(--ec-radius); padding:24px; }
.ec-apply-card h3{ color:var(--ec-white); font-size:17px; }
.ec-apply-card .row{ display:flex; justify-content:space-between; font-size:13.5px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.14); }
.ec-apply-card .row span:first-child{ color:rgba(255,255,255,0.65); }
.ec-apply-card .ec-btn{ width:100%; justify-content:center; margin-top:16px; }
.ec-apply-card .ec-btn + .ec-btn{ margin-top:10px; }

/* enquiry form */
.ec-form{ display:flex; flex-direction:column; gap:12px; }
.ec-form input, .ec-form textarea, .ec-form select{
  width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--ec-line);
  font-family:inherit; font-size:14px; background:var(--ec-bg);
}
.ec-form label{ font-size:12.5px; font-weight:700; color:var(--ec-navy); margin-bottom:4px; display:block; }
.ec-form-msg{ font-size:13px; color:var(--ec-blue); font-weight:600; }

/* related courses */
.ec-related-strip{ display:flex; gap:16px; overflow-x:auto; padding-bottom:8px; }
.ec-related-strip .ec-card{ min-width:250px; }

/* skeleton loaders */
.ec-skeleton{ background:linear-gradient(90deg,#e7eef4 25%,#f2f7fb 37%,#e7eef4 63%); background-size:400% 100%; animation:ec-shimmer 1.4s ease infinite; border-radius:12px; }
@keyframes ec-shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

/* homepage bits */
.ec-hero-home{
  background: linear-gradient(160deg,var(--ec-navy),var(--ec-navy-2));
  color:var(--ec-white); padding:96px 0 120px; position:relative; overflow:hidden;
}
.ec-hero-home .stripes{
  position:absolute; inset:0; opacity:.08;
  background:repeating-linear-gradient(115deg,var(--ec-blue-light) 0 2px,transparent 2px 34px);
}
.ec-stat-row{ display:flex; gap:34px; margin-top:36px; flex-wrap:wrap; }
.ec-stat b{ font-family:var(--ec-font-mono); font-size:26px; display:block; color:var(--ec-white); }
.ec-stat span{ font-size:12.5px; color:rgba(255,255,255,0.7); }

.ec-why-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:20px; }
.ec-why-card{ background:var(--ec-white); border-radius:var(--ec-radius); padding:24px; border:1px solid var(--ec-line); box-shadow:var(--ec-shadow-sm); }
.ec-why-card .n{ font-family:var(--ec-font-mono); color:var(--ec-blue-light); background:var(--ec-navy); width:36px;height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:700; margin-bottom:14px; }

.ec-process-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:0; position:relative; }
.ec-process-step{ padding:0 18px; position:relative; }
.ec-process-step:not(:last-child)::after{
  content:""; position:absolute; top:18px; right:-6px; width:12px; height:1px; background:var(--ec-line);
}
.ec-process-step .idx{ font-family:var(--ec-font-mono); color:var(--ec-blue); font-weight:700; font-size:13px; }
.ec-process-step h4{ font-size:15px; margin:10px 0 6px; }
.ec-process-step p{ font-size:13px; color:var(--ec-ink-soft); }

.ec-testi-card{ background:var(--ec-white); border-radius:var(--ec-radius); padding:24px; border:1px solid var(--ec-line); box-shadow:var(--ec-shadow-sm); }
.ec-testi-card p{ font-size:14.5px; color:var(--ec-ink); line-height:1.6; }
.ec-testi-who{ display:flex; align-items:center; gap:10px; margin-top:14px; }
.ec-testi-avatar{ width:38px; height:38px; border-radius:50%; background:var(--ec-blue-light); display:flex; align-items:center; justify-content:center; color:var(--ec-white); font-weight:700; font-family:var(--ec-font-mono); }

/* dark mode (toggle-based) */
.ec-scope.ec-dark{ --ec-bg:#0B1620; --ec-white:#12202E; --ec-ink:#EAF2F8; --ec-ink-soft:#93A9BC; --ec-line: rgba(255,255,255,0.09); }
.ec-scope.ec-dark .ec-card, .ec-scope.ec-dark .ec-panel, .ec-scope.ec-dark .ec-why-card, .ec-scope.ec-dark .ec-testi-card{ background:#16283A; }
.ec-scope.ec-dark .ec-info-item, .ec-scope.ec-dark .ec-module-list li{ background:#0F2032; }
.ec-scope.ec-dark h1, .ec-scope.ec-dark h2, .ec-scope.ec-dark h3, .ec-scope.ec-dark h4{ color:#EAF2F8; }
.ec-scope.ec-dark .ec-search-panel{ background:#16283A; }

/* responsive */
@media (max-width: 900px){
  .ec-detail-layout{ grid-template-columns:1fr; }
  .ec-mm-grid{ grid-template-columns:repeat(2,1fr); }
  .ec-process-strip{ grid-template-columns:1fr 1fr; gap:20px; }
  .ec-process-step:not(:last-child)::after{ display:none; }
}
@media (max-width: 640px){
  .ec-search{ width:200px; }
  .ec-megamenu{ width:94vw; left:50%; padding:18px; }
  .ec-mm-grid{ grid-template-columns:1fr; }
  .ec-info-grid{ grid-template-columns:1fr; }
  .ec-process-strip{ grid-template-columns:1fr; }
}

@media (prefers-reduced-motion: reduce){
  .ec-scope *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

<script>
  const app = document.getElementById('ec-app');
  app.innerHTML = '<div class="ec-section"><div class="ec-container">Loading course catalogue...</div></div>';
  loadCourseData()
    .then(() => EOSHCourses.init({ headerMount: '#ec-header-mount', appMount: '#ec-app' }))
    .catch(error => {
      console.error('Unable to load course catalogue:', error);
      app.innerHTML = '<div class="ec-section"><div class="ec-container"><p role="alert">Course catalogue could not be loaded. Please refresh to try again.</p></div></div>';
    });

  function performSearch() {
    var input = document.getElementById('site-search');
    var q = input ? input.value.trim() : '';
    location.hash = '#/courses' + (q ? ('?q=' + encodeURIComponent(q)) : '');
  }

  const darkBtn = document.getElementById('dark-toggle');
  darkBtn.addEventListener('click', () => {
    document.querySelectorAll('.ec-scope').forEach(elx => elx.classList.toggle('ec-dark'));
    darkBtn.classList.toggle('active');
    darkBtn.textContent = darkBtn.classList.contains('active') ? '☀️ Light mode' : '🌙 Dark mode';
  });
</script>
<script>
function prepareWhatsAppLink() {
    const form = document.getElementById('ec-enquiry-form');
    const whatsappNumber = "916238501454";

    const name = form?.querySelector('input[name="name"]')?.value.trim() || "";
    const courseName = form?.querySelector('input[name="Course name"]')?.value.trim() || "";
    const email = form?.querySelector('input[name="email"]')?.value.trim() || "";
    const message = form?.querySelector('textarea[name="message"]')?.value.trim() || "";

    const text = [
        "*New Course Enquiry*",
        "",
        `Name: ${name || "Not provided"}`,
        `Course: ${courseName || "Not provided"}`,
        `Email: ${email || "Not provided"}`,
        "",
        `Message: ${message || "No additional details provided."}`
    ].join("\n");

    const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(text)}`;
    const opened = window.open(url, '_blank', 'noopener,noreferrer');

    if (!opened) {
        window.location.href = url;
    }
}
</script>
